
name: Build Pia APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - pia-direct-bridge-source.zip
      - .github/workflows/build-from-zip.yml

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -oq pia-direct-bridge-source.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test URL parsing
        run: |
          mkdir -p /tmp/pia-classes
          javac -encoding UTF-8 -d /tmp/pia-classes app/src/main/java/dev/pialink/bridge/PiaUrl.java tests/UrlParserTest.java
          java -cp /tmp/pia-classes UrlParserTest

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pia-direct-bridge-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
